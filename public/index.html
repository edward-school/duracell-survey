<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duracell Family Conversation</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/base.css">
<link rel="stylesheet" href="/join.css">
</head>
<body>
<main class="wrap">
  <div class="brand"><img src="/icon.svg" alt="" width="28" height="28"> Duracell · SIBKL</div>
  <h1>Join the conversation</h1>
  <p class="muted">Enter the session code shown on the screen.</p>
  <form class="codeform" action="/join-redirect" id="f">
    <input id="c" type="text" autocomplete="off" autocapitalize="characters" maxlength="8" aria-label="Session code" required>
    <button class="primary" type="submit">Join</button>
  </form>
  <p class="small muted" style="margin-top:40px">Facilitator? <a href="/host">Open the dashboard</a></p>
</main>
<script src="/index.js"></script>
</body>
</html>
