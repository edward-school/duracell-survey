<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duracell Results</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/base.css">
<link rel="stylesheet" href="/slides.css">
<style>
  html, body { height: 100%; background: #14110f; overflow: hidden; }
  .stage { height: 100vh; display: grid; place-items: center; }
  .stage .slide-frame { width: min(100vw, 177.78vh); border-radius: 0; }
  .pnav { position: fixed; right: 16px; bottom: 14px; display: flex; gap: 8px; align-items: center; opacity: .0; transition: opacity .3s; }
  body.mouse .pnav { opacity: 1; }
  .pnav button { background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.2); color: #fff; min-height: 40px; }
  .pnav span { color: #c9bcad; font-size: 14px; padding: 0 8px; }
  .offline { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); background: #f6e5bb; color: #5e3d00; padding: 4px 12px; border-radius: 99px; font-size: 14px; }
  .gate { color: #f6efe6; text-align: center; max-width: 520px; padding: 20px; }
  .gate a { color: #e9a07c; }
</style>
</head>
<body>
<div class="stage" id="stage"><div class="gate">Loading…</div></div>
<div class="pnav" id="pnav" aria-label="Slide controls">
  <button id="prev" aria-label="Previous slide">← Prev</button>
  <span id="pos" aria-live="polite"></span>
  <button id="next" aria-label="Next slide">Next →</button>
  <button id="fs" aria-label="Full screen">Full screen</button>
</div>
<div id="offline" class="offline hidden">Reconnecting…</div>
<script src="/common.js"></script>
<script src="/slides.js"></script>
<script src="/present.js"></script>
</body>
</html>
